<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Bacaan Mandarin HSK 8-9 — 50 Hari (versi cetak)</title>
<style>
  @page { size: A4; margin: 18mm 18mm 16mm 18mm; }
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; color: #1d1d1f; margin: 0; background: #fff; }
  .latin { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  .cover h1 { font-size: 30pt; margin: 4mm 0 3mm; color: #1e3a8a; letter-spacing: 2px; }
  .cover .sub { font-size: 12pt; color: #444; margin-bottom: 5mm; }
  .cover .note { font-size: 9.5pt; color: #555; line-height: 1.55; border-left: 4px solid #f5b700; padding-left: 10px; margin-bottom: 5mm; }
  table.plan { width: 100%; border-collapse: collapse; font-size: 9pt; }
  table.plan th, table.plan td { border-bottom: 1px solid #ddd; padding: 3.2px 6px; text-align: left; }
  table.plan th { background: #e6eeff; color: #1e3a8a; }
  table.plan td.box { width: 28px; text-align: center; }
  .chk { display: inline-block; width: 11px; height: 11px; border: 1.3px solid #888; border-radius: 2px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid #f5b700; padding-bottom: 3mm; margin-bottom: 5mm; }
  .head .day { font-size: 11pt; color: #1e3a8a; font-weight: bold; }
  .head .meta { font-size: 9pt; color: #777; }
  h2 { font-size: 18pt; margin: 0 0 1.5mm; line-height: 1.35; }
  .topic { font-size: 9.5pt; color: #666; margin-bottom: 5mm; }
  .text p { font-size: 12pt; line-height: 1.85; text-indent: 2em; margin: 0 0 1.8mm; text-align: justify; }
  .vocab { margin-top: 5mm; page-break-inside: avoid; }
  .vocab h3 { font-size: 10pt; color: #1e3a8a; margin: 0 0 2mm; }
  .vocab table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
  .vocab td { border-top: 1px solid #e5e5e5; padding: 2px 6px; vertical-align: top; }
  .vocab td.w { width: 22%; font-weight: bold; }
  .vocab td.py { width: 28%; color: #555; }
  .q { margin-top: 4mm; font-size: 9.5pt; color: #333; background: #fff8db; border-left: 4px solid #f5b700; padding: 3mm 4mm; border-radius: 3px; page-break-inside: avoid; }
</style>
</head>
<body>
<div id="root"></div>
<script src="data/texts-1.js"></script>
<script src="data/texts-2.js"></script>
<script src="data/texts-3.js"></script>
<script>
const D = window.TEXTS;
const BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const start = new Date(2026, 9, 31);
function tgl(i){ const d = new Date(start); d.setDate(d.getDate()+i); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; }
const hanzi = s => (s.match(/[一-鿿]/g)||[]).length;
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function planRows(from, to){
  let r = `<table class="plan"><tr><th>Hari</th><th>Tanggal</th><th>Judul</th><th>字</th><th></th></tr>`;
  for (let i = from; i < to; i++) r += `<tr><td class="latin">${i+1}</td><td class="latin">${tgl(i)}</td><td>${D[i].t}</td><td class="latin">${hanzi(D[i].p)}</td><td class="box"><span class="chk"></span></td></tr>`;
  return r + `</table>`;
}

let html = `<div class="page cover">
<h1>五十天中文精读</h1>
<div class="sub latin">50 Teks Bacaan Mandarin Faktual · Level HSK 8–9 · ${tgl(0)} – ${tgl(D.length-1)}</div>
<div class="note latin">Cara pakai: baca satu teks per hari sampai habis. Baca dulu tanpa melihat kosakata, tandai kata yang belum dikenal, lalu cek tabel 重点词语. Akhiri dengan menjawab 思考题 dalam bahasa Mandarin. Versi web interaktif (ketuk kata untuk pinyin &amp; terjemahan) tersedia di repositori GitHub yang sama.<br>Semua teks ditulis khusus untuk latihan ini dengan merangkum fakta yang umum diterima.</div>
${planRows(0, 25)}</div>
<div class="page cover">${planRows(25, D.length)}</div>`;

D.forEach((d,i)=>{
  const n = hanzi(d.p);
  html += `<div class="page">
  <div class="head"><span class="day latin">Hari ${i+1} · 第${i+1}天</span><span class="meta latin">${tgl(i)} · ${n} 字 · ±${Math.round(n/150)}–${Math.round(n/100)} menit</span></div>
  <h2>${esc(d.t)}</h2><div class="topic latin">${esc(d.id)}</div>
  <div class="text">${d.p.split(/\n\s*\n/).map(x=>`<p>${esc(x.trim())}</p>`).join("")}</div>
  <div class="vocab"><h3>重点词语 · Kosakata penting</h3><table>${d.v.map(w=>`<tr><td class="w">${w[0]}</td><td class="py latin">${w[1]}</td><td class="latin">${w[2]}</td></tr>`).join("")}</table></div>
  <div class="q"><b>思考题：</b>${esc(d.q)}</div>
  </div>`;
});
document.getElementById("root").innerHTML = html;
</script>
</body>
</html>
